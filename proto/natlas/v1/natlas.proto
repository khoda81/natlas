syntax = "proto3";

package natlas.v1;

// natlas draws a nested interval tree that a server measures on demand. One
// server serves one measure; comparing two measures means asking two servers
// about the same nodes.
//
// Every node owns one interval, partitioned by its children. A child is named
// by a 32-bit label whose meaning (a vocabulary, for a language model) is
// agreed outside this protocol; siblings have distinct labels.
//
// Nodes are named by 64-bit handles that the server chooses and the client
// only learns: a request names a node by its parent's handle and its own
// label, and the response begins with the node's handle, by which the client
// names its children in turn. The root needs no name. A handle means
// something only to the server that gave it.
//
// A server that has forgotten a handle, as after a restart, answers
// NOT_FOUND. The client then names that parent afresh by its own parent,
// going up only as far as the server still knows.

service Natlas {
  // A node's handle, then its children, heaviest first, down to 2^-horizon of
  // its weight. The client may cancel at any point: every prefix is a valid
  // listing.
  rpc Expand(ExpandRequest) returns (stream ExpandResponse);
}

message ExpandRequest {
  // The root when unset.
  Child node = 1;
  // In bits. The server lists every child of conditional weight at least
  // 2^-horizon and stops there, so every child it leaves out is lighter. It
  // also sets the step of Edge.odds. At 0 the server lists nothing: the
  // client asks only for the handle.
  uint32 horizon = 2;
}

// The child with `label` of the node the server gave `parent` to.
message Child {
  fixed64 parent = 1;
  uint32 label = 2;
}

message ExpandResponse {
  oneof part {
    // The first message, and only the first: the node's handle.
    fixed64 node = 1;
    Edge edge = 2;
  }
}

// One child. Its weight w_k is a fraction g_k of the previous child's,
// w_k = g_k * w_{k-1} with w_{-1} = 1, so a listing is sorted by construction.
// The client sums nothing up front; what the listed children leave of 1 is
// the weight of the rest.
message Edge {
  uint32 label = 1;
  // ln(g / (1 - g)) in steps of horizon * ln 2 / 2^31 nat. 2^31 - 1 means
  // g = 1: a tie with the previous child or, for the first, the whole interval.
  // Since w_k >= 2^-horizon, every value fits.
  //
  // A server encodes each g against the previous weight as the client decodes
  // it, so rounding never accumulates. Nothing stops a server from listing
  // more than the whole interval; a client may stop reading where it does.
  sfixed32 odds = 2;
}

// A recorded server, used for static datasets: one Expand per node.
message Snapshot {
  repeated Expansion expansions = 1;
}

message Expansion {
  ExpandRequest request = 1;
  fixed64 node = 2;
  repeated Edge edges = 3;
}
