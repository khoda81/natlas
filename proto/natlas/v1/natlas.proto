syntax = "proto3";

package natlas.v1;

// natlas draws a nested interval tree that a server measures on demand. One
// server serves one measure; comparing two measures means asking two servers
// about the same nodes.
//
// Every node owns one interval, partitioned by its children. A child is named
// by a 32-bit label whose meaning (a vocabulary, for a language model) is
// agreed outside this protocol; siblings have distinct labels. Nodes are named
// by handles hashed from their path of labels, so a client names any node it
// has seen listed without asking:
//
//   handle(root)                     = 0
//   handle(child of h with label l)  = mix64(h + 0x9e3779b97f4a7c15 * (l + 1))
//
// with arithmetic mod 2^64 and mix64 the SplitMix64 finalizer:
//
//   z = (z ^ z >> 30) * 0xbf58476d1ce4e5b9
//   z = (z ^ z >> 27) * 0x94d049bb133111eb
//   z =  z ^ z >> 31
//
// mix64 is a bijection, so siblings never collide; other collisions are left
// to chance at 64 bits.

service Natlas {
  // The children of a node, heaviest first, down to 2^-horizon of its weight.
  // The client may cancel at any point: every prefix is a valid listing.
  rpc Expand(ExpandRequest) returns (stream Edge);
}

message ExpandRequest {
  fixed64 node = 1;
  // In bits. The server lists every child of conditional weight at least
  // 2^-horizon and stops there, so every child it leaves out is lighter. It
  // also sets the step of Edge.odds.
  uint32 horizon = 2;
}

// One child. Its weight w_k is a fraction g_k of the previous child's,
// w_k = g_k * w_{k-1} with w_{-1} = 1, so a listing is sorted by construction.
// The client sums nothing up front; what the listed children leave of 1 is
// the weight of the rest.
message Edge {
  uint32 label = 1;
  // ln(g / (1 - g)) in steps of horizon * ln 2 / 2^31 nat. 2^31 - 1 means
  // g = 1: a tie with the previous child or, for the first, the whole interval.
  // Since w_k >= 2^-horizon, every value fits.
  //
  // A server encodes each g against the previous weight as the client decodes
  // it, so rounding never accumulates. Nothing stops a server from listing
  // more than the whole interval; a client may stop reading where it does.
  sfixed32 odds = 2;
}

// A recorded server, used for static datasets: one Expand per node.
message Snapshot {
  repeated Expansion expansions = 1;
}

message Expansion {
  ExpandRequest request = 1;
  repeated Edge edges = 2;
}
