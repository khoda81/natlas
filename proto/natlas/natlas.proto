syntax = "proto3";

package natlas;

// natlas draws a distribution over sequences of 32-bit integers as a nested
// interval tree that a server measures on demand. One server serves one
// measure; comparing two measures means asking two servers about the same
// nodes.
//
// A node is a sequence, and its children are its 2^32 one-integer
// extensions: its branches. Every branch exists; one a server never lists has
// weight zero. What a branch denotes is agreed outside this protocol.
//
// Nodes are named by ids hashed from their branches, so the client and every
// server name a node alike without exchanging the sequence:
//
//   id(root)                       = 0
//   id(child of h along branch b)  = mix64(h + 0x9e3779b97f4a7c15 * (b + 1))
//
// with arithmetic mod 2^64 and mix64 the SplitMix64 finalizer:
//
//   z = (z ^ z >> 30) * 0xbf58476d1ce4e5b9
//   z = (z ^ z >> 27) * 0x94d049bb133111eb
//   z =  z ^ z >> 31
//
// mix64 is a bijection, so siblings never collide; other collisions are left
// to chance at 64 bits.

service Natlas {
  // Reads the tree at an address below a node: down a path of branches, and
  // then within the node the path ends at. It answers one node at a time
  // with the children it places there:
  //
  // - down the path: the starting node and every node along it, each
  //   placing the path's next branch;
  // - then, at its end, either points, sampled evenly through parts of the
  //   node: the children holding them, and where several points all fall in
  //   one child, that child alone and the same points within it, so a view
  //   samples its children and a deep zoom reaches them in one request. One
  //   point is its child alone;
  // - or branches: those children of the node, for a measure read only for
  //   q;
  // - or nothing: the path's last branch names the node it reaches, which
  //   the server learns but does not read.
  //
  // So every message but the last places a single child, and the next
  // message is that child's: id(node, its branch). Each child is placed
  // once, however many points it holds; a point in a part the server does
  // not know places nothing.
  //
  // A server may end the stream early at any node, and ends a path before a
  // branch of weight zero, which has no place. It answers NOT_FOUND when it
  // has not learned the starting node, and the client names it from the
  // root by a longer path.
  rpc Expand(ExpandRequest) returns (stream Children);
  // The sequence for a text, under the server's text mapping. The server
  // learns the ids along it, so expanding them needs no path.
  rpc Search(SearchRequest) returns (SearchResponse);
}

message ExpandRequest {
  fixed64 node = 1;
  // Branches down from the node.
  repeated uint32 path = 2;
  // What to read of the node the path ends at.
  oneof within {
    Points points = 3;
    Branches branches = 4;
  }
}

// Points of a node, sampled from parts of it.
message Points {
  repeated Part parts = 1;
}

// `count` points evenly through the part of a node from `top` down
// e^ln_mass of its mass, each in the middle of its share. A part of no mass
// (ln_mass −∞) is its top alone; points past the node's bottom are none.
message Part {
  // The fraction of the node's mass above the part, as digits in base 256,
  // most significant first: exact however deep in the node, or in its light
  // tail, the part is.
  bytes top = 1;
  double ln_mass = 2;
  uint32 count = 3;
}

// Branches of one node.
message Branches {
  repeated uint32 branches = 1;
}

// What a source places of one node's children.
message Children {
  repeated Run runs = 1;
  // How many of the node's children have weight, where the source knows:
  // the rank its last child ends at. A node without children says 0.
  optional uint32 count = 2;
}

// Consecutive ranks of a node's children in the measure's order: heaviest
// first, ties by increasing branch.
message Run {
  uint32 rank = 1;
  repeated uint32 branches = 2;
  // ln of the mass at and below each edge, conditional on the node: edge i
  // tops rank `rank + i`, and the last bottoms the run, one more edge than
  // branches. Summed from the light end, so tiny masses survive.
  repeated double ln_below = 3;
}

// A session: one client, one WebSocket to a server at /session, carrying a
// Demand from the client whenever its view changes and Updates from the
// server. The client says what it is looking at; the server works out what
// the view lacks, answers what it holds at once, and computes the missing
// distribution the most pixel rows wait on next.

// What the client is looking at now, in place of what it looked at before.
message Demand {
  // The measures in view: p places children and orders them, q sizes them.
  uint32 p = 1;
  uint32 q = 2;
  optional View view = 3;
  // Placed before anything else: a flight's or a restore's path, or the
  // origin's place in its parent when the view reaches past the origin. A
  // path stated again goes on where it was.
  optional Path path = 4;
}

// An interval of a node's p mass, and the pixel rows it covers. Its rows
// flow down the tree: an interval splits among the children it covers by the
// mass of each it covers, a child worth a row or more goes on while its
// children start on screen, and a stretch of thinner children is sampled.
message View {
  // The deepest node the client knows that holds the whole view.
  fixed64 node = 1;
  // The fraction of the node's mass above the view, as digits in base 256,
  // most significant first: exact however deep the view is.
  bytes top = 2;
  // ln of the view's height, as a fraction of the node's mass.
  double ln_height = 3;
  // The pixel rows the view covers: physical ones, the picture's finest.
  double rows = 4;
  // How far right the screen reaches, in nats of -ln q from where the
  // node's children start.
  double right = 5;
}

// Branches down from a node.
message Path {
  fixed64 node = 1;
  repeated uint32 branches = 2;
}

// What the server tells the client, a batch at a time.
message Updates {
  repeated Update updates = 1;
}

message Update {
  oneof kind {
    // Children of a node, under a measure, the client was not sent before.
    Answer answer = 1;
    // The demand names a node this server has not learned: the client names
    // it again by its path, from a node the server knows.
    fixed64 unknown = 2;
    // The demand's path is placed as far as the source places it.
    Path placed = 3;
    // The source will never have this distribution: a recording that did
    // not record it.
    Missing lacks = 4;
    // Computing a distribution failed, too long for the context or worse.
    Failed failed = 5;
  }
}

message Answer {
  uint32 measure = 1;
  fixed64 node = 2;
  // Its parent and branch, absent at the root: the client may not have
  // named a node the view reached.
  optional fixed64 parent = 3;
  optional uint32 branch = 4;
  Children children = 5;
}

message Missing {
  uint32 measure = 1;
  fixed64 node = 2;
}

message Failed {
  uint32 measure = 1;
  fixed64 node = 2;
  string message = 3;
}

message SearchRequest {
  string text = 1;
}

message SearchResponse {
  // Branches from the root.
  repeated uint32 path = 1;
}

// A recorded server, used for static datasets: what it knows of each node.
message Snapshot {
  repeated Recording recordings = 2;
}

message Recording {
  // Branches from the root.
  repeated uint32 path = 1;
  Children children = 3;
}
