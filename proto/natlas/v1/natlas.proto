syntax = "proto3";

package natlas.v1;

// natlas draws an integer-sequence distribution as a nested interval tree that
// a server measures on demand. One server serves one measure; comparing two
// measures means asking two servers about the same paths.
//
// Every node is identified globally by its complete path of 32-bit labels from
// the root; the root is the empty path. A label's meaning (a vocabulary, for a
// language model) is agreed outside this protocol, and siblings have distinct
// labels. Every node owns one interval, partitioned by its children.

service Natlas {
  // A node's children, heaviest first, down to 2^-horizon of its weight. The
  // client may cancel at any point: every prefix is a valid listing.
  rpc Expand(ExpandRequest) returns (stream Edge);
  // The label path for a text, under the server's text-to-label mapping.
  rpc Search(SearchRequest) returns (SearchResponse);
}

message ExpandRequest {
  // The complete label path from the root; empty for the root itself.
  repeated uint32 path = 1;
  // In bits. The server lists every child of conditional weight at least
  // 2^-horizon and stops there, so every child it leaves out is lighter. It
  // also sets the step of Edge.odds. At 0 the server lists nothing.
  uint32 horizon = 2;
}

message SearchRequest {
  string text = 1;
}

message SearchResponse {
  // The complete label path from the root for the requested text.
  repeated uint32 path = 1;
}

// One child. Its weight w_k is a fraction g_k of the previous child's,
// w_k = g_k * w_{k-1} with w_{-1} = 1, so a listing is sorted by construction.
// The client sums nothing up front; what the listed children leave of 1 is
// the weight of the rest.
message Edge {
  uint32 label = 1;
  // ln(g / (1 - g)) in steps of horizon * ln 2 / 2^31 nat. 2^31 - 1 means
  // g = 1: a tie with the previous child or, for the first, the whole interval.
  // Since w_k >= 2^-horizon, every value fits.
  //
  // A server encodes each g against the previous weight as the client decodes
  // it, so rounding never accumulates. Nothing stops a server from listing
  // more than the whole interval; a client may stop reading where it does.
  sfixed32 odds = 2;
}

// A recorded server, used for static datasets: one Expand per node.
message Snapshot {
  repeated Expansion expansions = 1;
  // 2 identifies path-based snapshots; handle-based recordings had no version.
  uint32 format_version = 2;
}

message Expansion {
  ExpandRequest request = 1;
  repeated Edge edges = 2;
}
